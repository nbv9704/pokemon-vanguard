name: Verify game and source release
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run content:inventory
      - run: npm run test:inventory
      - run: npm test
      - name: Detect leaked generated changes
        run: git diff --exit-code
  release-smoke:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cd app && npm ci
      - name: Create a source archive and verify member hashes
        run: |
          python3 app/scripts/package-full.py --output "$RUNNER_TEMP/vanguard-source.zip"
          python3 app/scripts/verify-release.py "$RUNNER_TEMP/vanguard-source.zip"
          python3 - "$RUNNER_TEMP/vanguard-source.zip" "$RUNNER_TEMP/clean" <<'PY'
          import pathlib,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:archive.extractall(sys.argv[2])
          assert (pathlib.Path(sys.argv[2])/'PokemonVanguard/app/package-lock.json').is_file()
          PY
      - name: Check the exact unpacked release without workspace dependencies
        working-directory: ${{ runner.temp }}/clean/PokemonVanguard/app
        run: |
          npm ci
          npm run check
          node --test tests/release-packaging-b09.test.mjs tests/http-cache-b09.test.mjs tests/test-inventory-b09.test.mjs
      - name: One handle-leak check without --test-force-exit
        working-directory: ${{ runner.temp }}/clean/PokemonVanguard/app
        run: node --test tests/http-cache-b09.test.mjs tests/test-inventory-b09.test.mjs
