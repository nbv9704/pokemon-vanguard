<body class="aether-gba">
  <div id="app">
    <div class="loading">
      <div class="brandmark project-logo"><img src="/logo.png" alt="Pokémon Vanguard logo"></div>
      <h1>POKÉMON VANGUARD</h1>
      <p id="connection">Loading Aether GBA interface…</p>
    </div>
  </div>
  <div id="toast" role="status"></div>
  <div id="modal"></div>
  <button class="gba-menu-toggle" type="button" aria-expanded="false" aria-label="Open game menu">
    <span>START</span>
    MENU
  </button>
  <a class="classic-ui-switch" href="/" aria-label="Open current interface">CURRENT UI</a>
  <script type="module" src="/classic-ui.js"></script>
  <script type="module" src="/client.js"></script>
